# https://docs.github.com/ru/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
name: Сообщение об ошибке
description: Помогите нам исправить ошибку в нашем продукте или на нашем сайте
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        **Прежде чем заполнять форму:**
        * проверьте, нет ли [существующих запросов](https://github.com/XCode-NLP/KodaCode/issues?q=is%3Aissue%20state%3Aopen%20type%3ABug) на эту же тему;
        * проверьте наличие обновлений, установите их (при наличии) и перепроверьте наличие этой ошибки.

        Если подобный запрос существует или ошибка уже исправлена, *это обращение* будет закрыто.

        Лучше проголосуйте за существующий запрос вместо создания нового.

  - type: checkboxes
    id: products
    attributes:
      label: Продукт
      description: Укажите, где вы встретили ошибку
      options:
        - label: Koda Desktop
          required: false
        - label: Плагин для VSCode
          required: false
        - label: Плагин для JetBrains IDE
          required: false
        - label: Консольная утилита (CLI)
          required: false
        - label: Веб-сайт ([kodacode.ru](https://kodacode.ru))
          required: false
        - label: Документация ([docs.kodacode.ru](https://docs.kodacode.ru))
          required: false
        - label: Личный кабинет ([kodacode.ru/account](https://kodacode.ru/account))
          required: false
        - label: Модели, предоставляемые Kodacode
          required: false
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Операционная система и версия
      placeholder: "Например: Windows 11"
    validations:
      required: true

  - type: input
    id: koda_version
    attributes:
      label: Версия Koda и название модели
      description: |
        Версия Koda Desktop, плагина или консольной утилиты и название модели, на которой воспроизводится ошибка.
        Как узнать версию: [CLI](https://docs.kodacode.ru/cli/troubleshooting.html#current-version), [Desktop](https://docs.kodacode.ru/desktop/faq.html#current-version), [плагин](https://docs.kodacode.ru/plugin/troubleshooting/index.html#current-version).
      placeholder: "Например: 2.0.0, модель — как выбрана в Koda"
    validations:
      required: true

  - type: textarea
    id: ide_version
    attributes:
      label: Версия IDE (для плагина)
      description: |
        Только для плагина.
        Версия плагина показана в диалоге [«О Koda»](https://docs.kodacode.ru/plugin/troubleshooting/index.html#current-version), версия IDE и плагина — в разделе [«Версии ПО»](https://docs.kodacode.ru/plugin/troubleshooting/diagnostics.html#versions).
        Для Koda Desktop и консольной утилиты оставьте прочерк.
      render: text
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Чёткое и краткое описание, в чём заключается ошибка
      placeholder: Опишите проблему...

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите шаги для воспроизведения ошибки
      placeholder: |
        1. Перейдите в '...'
        2. Нажмите на '...'
        3. Прокрутите вниз до '...'
        4. Увидите ошибку
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Ожидаемое поведение
      description: Чёткое и краткое описание того, что вы ожидали
      placeholder: Опишите, как должно работать...

  - type: textarea
    id: actual_behavior
    attributes:
      label: Фактическое поведение
      description: Чёткое и краткое описание того, что произошло на самом деле
      placeholder: Опишите, что произошло на самом деле...
    validations:
      required: true

  - type: textarea
    id: evidences
    attributes:
      label: Скриншоты, логи, конфиги, тестовые данные
      description: |
        Если возможно, добавьте скриншоты и логи, которые объясняют проблему.
        Тестовые (обезличенные, нечувствительные) данные тоже нам помогут.
        Если вы изменяли конфиг, приложите и его, но удалите чувствительные данные: токены, пароли и ключи к моделям.

        <details><summary>Как собрать логи и диагностические данные?</summary>

        * **Koda Desktop** — [логи и диагностика](https://docs.kodacode.ru/desktop/log.html): вкладка **Настройки → Логи**, кнопка **Скопировать отчёт**, файлы логов на диске.
        * **Плагин для VS Code и JetBrains IDE** — [сбор диагностической информации](https://docs.kodacode.ru/plugin/troubleshooting/diagnostics.html#logs-and-sessions): канал **Koda** в VS Code, кнопка **Dump Koda** в JetBrains, файл `core.log` и файлы сессий.
        * **Консольная утилита (CLI)** — [что собрать перед отправкой](https://docs.kodacode.ru/cli/troubleshooting.html#report-collect): команды `/about` и `/bug log generate`, запуск с флагом `--debug`.

        </details>

        <details><summary>Где лежат файлы конфигурации?</summary>

        **Убедитесь, что удалили из прилагаемого конфига чувствительные данные!**
        Например, токены, пароли или ключи к моделям.

        * **Плагин Koda (VS Code, JetBrains, OpenIDE, GigaIDE)**:
          * **Windows**: `%USERPROFILE%\.koda\config.yaml`
          * **Linux/MacOS**: `~/.koda/config.yaml`
        * **Консольная утилита (CLI)**:
          * **Windows**: `%USERPROFILE%\.kodacli\settings.json`
          * **Linux/MacOS**: `~/.kodacli/settings.json`

        </details>

      placeholder: Добавьте файлы в это поле
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Дополнительная информация
      description: Добавьте любую другую полезную информацию о проблеме

  - type: checkboxes
    id: checklist
    attributes:
      label: Чеклист
      options:
        - label: Я проверил существующие issues и уверен, что об этой ошибке ранее не сообщалось
          required: true
        - label: Я уверен, что эта ошибка сейчас не исправлена
          required: true
        - label: Я предоставил достаточно информации для понимания проблемы
          required: true
